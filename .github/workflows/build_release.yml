name: Build AAR

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Library version to publish (e.g. 0.2.0-themby.1)'
        required: true
        default: '0.2.0-themby.1'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkg-config libtool ninja-build python3-pip
          sudo pip3 install meson

      - name: Build the release artifacts
        run: |
          set -x
          unset ANDROID_SDK_ROOT
          cd buildscripts
          ./download.sh > /dev/null
          ./buildall.sh --arch x86_64 mpv
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh
        env:
          GRADLE_OPTS: -Xmx4G
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: themby-libmpv-aar
          path: lib/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Publish Maven repo to gh-pages
        env:
          LIB_VERSION: ${{ inputs.version }}
        run: |
          set -ex
          ./gradlew :lib:publishToMavenLocal -PlibVersion="$LIB_VERSION"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add -B gh-pages /tmp/pages FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages /tmp/pages
          fi
          mkdir -p /tmp/pages/io/github/chicring
          cp -r ~/.m2/repository/io/github/chicring/themby-libmpv /tmp/pages/io/github/chicring/
          cd /tmp/pages
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "publish themby-libmpv $LIB_VERSION" || true
          git push origin gh-pages
