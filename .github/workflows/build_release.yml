name: Build AAR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Library version to publish (e.g. 0.3.0-themby.1)'
        required: true
        default: '0.3.0-themby.1'
      publish:
        description: 'Publish Maven repo to gh-pages'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install pinned host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes autoconf gperf libssl-dev libtool nasm ninja-build pkgconf python3-pip
          source buildscripts/include/depinfo.sh
          rustup toolchain install "$v_rust" --profile minimal --no-self-update
          rustup default "$v_rust"
          cargo install cargo-c --version "$v_cargo_c" --locked
          python3 -m pip install --user --break-system-packages "meson==$v_meson"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build native libraries and AAR
        run: |
          set -x
          unset ANDROID_SDK_ROOT
          cd buildscripts
          IN_CI=1 ./download.sh > /dev/null
          ./buildall.sh --arch arm64 mpv
          ./buildall.sh --arch armv7l mpv
          ./buildall.sh -n mpv-android
        env:
          GRADLE_OPTS: -Xmx4G

      - name: Inspect artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aar-inspect && unzip -q -o lib/build/outputs/aar/lib-release.aar -d aar-inspect
          ls -l aar-inspect/jni/*/
          for abi in arm64-v8a armeabi-v7a; do
            strings aar-inspect/jni/$abi/libmpv.so | grep -qx 'dovi_parse_rpu' || { echo "no libdovi in $abi"; exit 1; }
          done

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: themby-libmpv-aar
          path: lib/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Publish Maven repo to gh-pages
        if: ${{ inputs.publish }}
        env:
          LIB_VERSION: ${{ inputs.version }}
        run: |
          set -ex
          ./gradlew :lib:publishToMavenLocal -PlibVersion="$LIB_VERSION"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add -B gh-pages /tmp/pages FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages /tmp/pages
          fi
          mkdir -p /tmp/pages/io/github/chicring
          cp -r ~/.m2/repository/io/github/chicring/themby-libmpv /tmp/pages/io/github/chicring/
          cd /tmp/pages
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "publish themby-libmpv $LIB_VERSION" || true
          git push origin gh-pages
